# Netlify build configuration for ECOVIA (Next.js App Router + Route Handlers).
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"

# Environment variables are configured in the Netlify UI:
#   DATABASE_URL
#   BETTER_AUTH_SECRET
#   BETTER_AUTH_URL
#   ADMIN_EMAIL
#   ADMIN_PASSWORD
